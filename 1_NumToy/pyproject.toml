[build-system]
requires = [
    "scikit-build-core",
    "pybind11"
]
build-backend = "scikit_build_core.build"

[project]
name = "numtoy"
version = "1.0.0"
description = "A lightweight multidimensional tensor library implemented in C++ with Python bindings."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Stefano Pala" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[tool.scikit-build]
cmake.build-type = "Release"
